name: W3C Code Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Validate HTML files
        uses: CyboZu-Corp/html-validator-action@v1
        with:
          files: '*.html'
